version: '3'

name: ${CONTAINER_PREFIX:-iut-}stack-php

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${USER_ID:-0}
        GROUP_ID: ${GROUP_ID:-0}
        USER_NAME: ${USER_NAME:-0}
        GROUP_NAME: ${GROUP_NAME:-0}
    container_name: ${CONTAINER_PREFIX:-iut-}php
    volumes:
      - "./:/var/www/html/"
    command: >
      sh -c "composer install --no-interaction & php-fpm"
  web:
    container_name: ${CONTAINER_PREFIX:-iut-}web
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8888:80"
    volumes:
      - "./:/var/www/html/"
  pma:
    image: phpmyadmin/phpmyadmin:5.2.2
    container_name: ${CONTAINER_PREFIX:-iut-}pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8886:80"
    depends_on:
      - db
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: ${CONTAINER_PREFIX:-iut-}db
    ports:
      - "3307:3306" # mysql
    environment:
      MYSQL_DATABASE: iut_symfony
      MYSQL_USER: iut
      MYSQL_PASSWORD: iut
      MYSQL_ROOT_PASSWORD: iut

