version: '3'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: iut-php
    volumes:
      - "./:/var/www/html/"
  web:
    container_name: iut-web
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8888:80"
      - "8887:81"
    volumes:
      - "./:/var/www/html/"
  pma:
    image: phpmyadmin/phpmyadmin
    container_name: iut-pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8886:80"
    depends_on:
      - db
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: iut-db
    ports:
      - "3307:3306" # mysql
    environment:
      MYSQL_DATABASE: iut_symfony
      MYSQL_USER: iut
      MYSQL_PASSWORD: iut
      MYSQL_ROOT_PASSWORD: iut

